name: smart_room
version: 0.7.0
description: "Independent smart room sidecar for Marvi — room control, presence fusion, and single-owner local vision. Native Windows, no Docker/WSL."
author: xRetro Labs
kind: backend
platforms:
  - windows
pip_dependencies:
  # Vision.
  - insightface>=0.7,<1
  - onnxruntime>=1.17,<2
  - opencv-python-headless>=4.10,<5
  - mediapipe>=0.10,<1
  # Devices and messaging. The health check reports on both of these and the
  # manifest declared neither, so they were never installed: every Tuya call
  # failed, MQTT was off, and the runtime log said "Tuya control disabled" on
  # every start while the room showed eleven thousand failed attempts.
  - tinytuya>=1.13,<2
  - paho-mqtt>=2,<3
  # Read at startup, before anything else can work: config.yaml and the device
  # credentials in secrets.env.
  - PyYAML>=6,<7
  - python-dotenv>=1,<2
provides_tools:
  - smart_room_state
  - smart_room_set_mode
  - smart_room_set_light
  - smart_room_cancel_sleep
  - smart_room_override
  - smart_room_health
  - smart_room_diagnostic
  - smart_room_alarm
  - smart_room_vision
  - smart_room_vision_identity
hooks:
  - on_gateway_start
  - on_gateway_stop
